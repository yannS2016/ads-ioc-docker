name: Build CI Docker image

# Rebuild only when ci/Dockerfile or its deps change
on:
  push:
    branches:
      - master
    paths:
      - 'Dockerfile'
      - 'deps/RELEASE_SITE'
  workflow_dispatch:  # allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ci:latest
            ghcr.io/${{ github.repository }}/ci:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/ci:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/ci:buildcache,mode=max
